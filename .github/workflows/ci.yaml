---
name: CI/CD pipeline for building Docker image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v3
      - uses: docker/login-action@v2
        with:
          registry: api.repoflow.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build Docker image
        run: docker build -t api.repoflow.io/bart-9481/docker/airflow/crypto-alert:latest .
      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          registry: api.repoflow.io        
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push image to Docker Hub
        run: docker push api.repoflow.io/bart-9481/docker/airflow/crypto-alert:latest
